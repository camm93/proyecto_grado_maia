# docker-compose.gpu.yml — Deploy con GPU NVIDIA
# ═══════════════════════════════════════════════════════════════════════════════
# Requiere:
#   - Docker >= 19.03
#   - NVIDIA driver instalado en el host
#   - NVIDIA Container Toolkit (nvidia-docker2):
#     https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#
# Uso:
#   docker compose -f docker-compose.gpu.yml up
#
# Verificar GPU en el contenedor:
#   docker compose -f docker-compose.gpu.yml exec maia python -c \
#     "import torch; print('CUDA:', torch.cuda.is_available(), 'Device:', torch.cuda.get_device_name(0))"
# ═══════════════════════════════════════════════════════════════════════════════

version: "3.9"

services:
  maia:
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu
    image: maia-rethoric-seg:gpu
    container_name: maia-rethoric-seg_gpu

    # Acceso a GPU (Compose 1.28+ con compose-spec)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1            # cambiar a "all" para todas las GPUs, o un número
              capabilities: [gpu]

    ports:
      - "${PORT:-8000}:8000"

    environment:
      - MODELS_DIR=/app/models
      - T1_DEVICE=cuda
      - T1_BATCH_SIZE=${T1_BATCH_SIZE:-32}
      - T1_PRELOAD=true
      - T1_LOG_PREDICTIONS=${T1_LOG_PREDICTIONS:-false}
      - T2_DEVICE=cuda
      - T2_BATCH_SIZE=${T2_BATCH_SIZE:-32}
      - T2_PRELOAD=true
      - T2_THRESHOLD=${T2_THRESHOLD:-0.5}
      - T2_LOG_PREDICTIONS=${T2_LOG_PREDICTIONS:-false}
      # LLMs vía API (opcional)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # Descarga de modelos al arranque (opcional)
      - DOWNLOAD_MODELS_ON_START=${DOWNLOAD_MODELS_ON_START:-false}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_REPO_T1=${HF_REPO_T1:-}
      - HF_REPO_T2=${HF_REPO_T2:-}
      - HF_REPO_T2_CTX=${HF_REPO_T2_CTX:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_PREFIX_T1=${S3_PREFIX_T1:-}
      - S3_PREFIX_T2=${S3_PREFIX_T2:-}
      - S3_PREFIX_T2_CTX=${S3_PREFIX_T2_CTX:-}

    volumes:
      - ./models:/app/models     # writable si DOWNLOAD_MODELS_ON_START=true
      - ./logs:/app/backend/logs # writable para predictions logging

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s  # más tiempo: el modelo demora en cargarse al startup
